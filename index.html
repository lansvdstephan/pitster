<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitster Quiz - Vinyl Timer</title>
    <style>
        :root {
            --pink: #ff1493;
            --yellow: #ffda00;
            --dark: #0a122e;
            --vinyl-black: #111;
        }

        body { 
            background: var(--dark); 
            color: white; 
            font-family: 'Arial Black', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        h1 { color: var(--pink); margin-bottom: 5px; letter-spacing: 2px; }
        .track-info { font-size: 1.2rem; margin-bottom: 30px; color: var(--yellow); }

        /* De Draaiende Plaat */
        .record-container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .record {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #333 2%, #111 5%, #111 15%, #000 16%, #111 20%, #000 25%, #111 30%, #000 35%, #111 40%, #000 45%, #111 50%, #000 55%, #111 60%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 1;
        }

        /* De Timer in het midden van de plaat */
        .timer-label {
            position: relative;
            width: 110px;
            height: 110px;
            background: var(--pink);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2; /* Bovenop de plaat */
            border: 6px solid rgba(255,255,255,0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .timer-val { font-size: 2.5rem; line-height: 1; }
        .timer-text { font-size: 0.7rem; text-transform: uppercase; }

        /* Animatie voor het draaien */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .playing .record {
            animation: spin 2.5s linear infinite;
        }

        /* Knoppen en Controls */
        .controls { margin-top: 40px; display: flex; gap: 15px; }
        
        button { 
            padding: 12px 25px; 
            font-size: 0.9rem; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-pause { background: var(--yellow); color: var(--dark); }
        .btn-reveal { background: white; color: var(--dark); }
        .hidden { display: none; }

        #answer-text { margin-top: 20px; color: var(--yellow); font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1>PITSTER QUIZ</h1>
    <div class="track-info">TRACK #<span id="track-num">--</span></div>

    <div class="record-container" id="record-player">
        <div class="record"></div>
        <div class="timer-label">
            <div class="timer-text">Seconds</div>
            <div class="timer-val" id="countdown">30</div>
        </div>
    </div>

    <div class="controls">
        <button id="pause-btn" class="btn-pause">PAUZE</button>
        <button id="reveal-btn" class="btn-reveal hidden">ONTHUL ANTWOORD</button>
    </div>

    <div id="answer-text" class="hidden"></div>

    <audio id="player"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const trackId = params.get('track');
        const audio = document.getElementById('player');
        const container = document.getElementById('record-player');
        const timerDisplay = document.getElementById('countdown');
        const pauseBtn = document.getElementById('pause-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const answerText = document.getElementById('answer-text');

        let timeLeft = 30;
        let timer;
        let isPlaying = false;

        if (trackId) {
            document.getElementById('track-num').innerText = trackId;
            audio.src = `${trackId.padStart(3, '0')}.mp3`;
        }

        // Starten bij klik op de plaat
        container.onclick = () => {
            if (!isPlaying && timeLeft > 0) {
                startMusic();
            }
        };

        function startMusic() {
            audio.play();
            isPlaying = true;
            container.classList.add('playing');
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    stopMusic();
                }
            }, 1000);
        }

        function stopMusic() {
            audio.pause();
            isPlaying = false;
            container.classList.remove('playing');
            clearInterval(timer);
            revealBtn.classList.remove('hidden');
        }

        pauseBtn.onclick = () => {
            if (isPlaying) {
                audio.pause();
                container.classList.remove('playing');
                isPlaying = false;
                pauseBtn.innerText = "VERDER";
            } else {
                audio.play();
                container.classList.add('playing');
                isPlaying = true;
                pauseBtn.innerText = "PAUZE";
            }
        };

        revealBtn.onclick = () => {
            answerText.innerText = "NR: " + trackId + " - Check je lijst!";
            answerText.classList.remove('hidden');
            audio.play();
            container.classList.add('playing');
        };
    </script>
</body>
</html>
