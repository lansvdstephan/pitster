<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitster Quiz - Vinyl Edition</title>
    <style>
        :root {
            --pink: #ff1493;
            --yellow: #ffda00;
            --orange: #ff8c00;
            --dark: #0a122e;
        }

        body { 
            background: var(--dark); 
            color: white; 
            font-family: 'Arial Black', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        h1 { color: var(--pink); margin-bottom: 5px; letter-spacing: 2px; }
        .track-info { font-size: 1.2rem; margin-bottom: 20px; color: var(--yellow); }

        /* De Draaiende Plaat */
        .record-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .record {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Conic gradient voor de 270 graden ringen zodat je de rotatie ziet */
            background: 
                conic-gradient(from 0deg, var(--pink) 0deg 270deg, transparent 270deg 360deg),
                conic-gradient(from 45deg, var(--orange) 0deg 270deg, transparent 270deg 360deg),
                conic-gradient(from 90deg, var(--yellow) 0deg 270deg, transparent 270deg 360deg),
                radial-gradient(circle, #222 0%, #000 100%);
            background-blend-mode: screen;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            z-index: 1;
        }

        /* De groeven over de kleuren heen */
        .record::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.4) 31%, transparent 32%, rgba(0,0,0,0.4) 40%, transparent 41%, rgba(0,0,0,0.4) 50%, transparent 51%);
        }

        /* De Timer in het midden */
        .timer-label {
            position: relative;
            width: 100px;
            height: 100px;
            background: #111;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 4px solid white;
        }

        .timer-val { font-size: 2.8rem; color: white; line-height: 1; }

        /* Animatie voor het draaien */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .playing .record {
            animation: spin 2s linear infinite;
        }

        /* Controls */
        .controls { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .row { display: flex; gap: 10px; }
        
        button { 
            padding: 12px 25px; 
            font-size: 0.9rem; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-pause { background: var(--yellow); color: var(--dark); }
        .btn-reveal { background: var(--pink); color: white; }
        .btn-next { background: white; color: var(--dark); margin-top: 10px; }
        .hidden { display: none; }
        
        #answer-text { margin-top: 15px; color: var(--yellow); font-size: 1.2rem; text-align: center; }
    </style>
</head>
<body>

    <h1>PITSTER</h1>
    <h2>DE MUZIEKQUIZ ZONDER CRISISMUZIEK</h2>
    <div class="track-info">TRACK #<span id="track-num">--</span></div>

    <div class="record-container" id="record-player">
        <div class="record"></div>
        <div class="timer-label">
            <div class="timer-val" id="countdown">30</div>
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <button id="pause-btn" class="btn-pause">START</button>
            <button id="reveal-btn" class="btn-reveal hidden">VERDER LUISTEREN</button>
        </div>
        <button id="next-btn" class="btn-next hidden">VOLGENDE SCAN</button>
        <div id="answer-text" class="hidden"></div>
    </div>

    <audio id="player"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const trackId = params.get('track');
        const audio = document.getElementById('player');
        const container = document.getElementById('record-player');
        const timerDisplay = document.getElementById('countdown');
        const pauseBtn = document.getElementById('pause-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const nextBtn = document.getElementById('next-btn');
        const answerText = document.getElementById('answer-text');

        let timeLeft = 30;
        let timer = null;
        let isPlaying = false;

        if (trackId) {
            document.getElementById('track-num').innerText = trackId;
            audio.src = `${trackId.padStart(3, '0')}.mp3`;
        }

        function togglePlay() {
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                container.classList.add('playing');
                pauseBtn.innerText = "PAUZE";
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timerDisplay.innerText = timeLeft;
                    } else {
                        stopMusic();
                    }
                }, 1000);
            } else {
                audio.pause();
                isPlaying = false;
                container.classList.remove('playing');
                pauseBtn.innerText = "VERDER";
                clearInterval(timer);
            }
        }

        function stopMusic() {
            audio.pause();
            isPlaying = false;
            container.classList.remove('playing');
            clearInterval(timer);
            pauseBtn.classList.add('hidden');
            revealBtn.classList.remove('hidden');
        }

        container.onclick = togglePlay;
        pauseBtn.onclick = togglePlay;

        revealBtn.onclick = () => {
            answerText.innerText = "ANTWOORD: Check lijst nr " + trackId;
            answerText.classList.remove('hidden');
            audio.play();
            container.classList.add('playing');
            nextBtn.classList.remove('hidden');
            revealBtn.innerText = "AAN HET AFSPELEN...";
        };

        nextBtn.onclick = () => {
            // Probeer venster te sluiten, anders terug naar start
            window.close();
            setTimeout(() => {
                window.location.href = "https://lansvdstephan.github.io/pitster/";
            }, 200);
        };
    </script>
</body>
</html>
