<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitster Quiz - Retro Vinyl</title>
    <style>
        :root {
            --pink: #ff1493;
            --yellow: #ffda00;
            --blue: #00bfff;
            --dark: #0a122e;
        }

        body { 
            background: var(--dark); 
            color: white; 
            font-family: 'Arial Black', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        h1 { color: var(--pink); margin-bottom: 5px; letter-spacing: 2px; }
        .track-info { font-size: 1.2rem; margin-bottom: 30px; color: var(--yellow); }

        /* De Draaiende Plaat met gekleurde ringen */
        .record-container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .record {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Retro kleuren effect in de groeven */
            background: radial-gradient(circle, 
                transparent 30%, 
                var(--pink) 31%, var(--pink) 32%, 
                #111 33%, 
                var(--blue) 40%, var(--blue) 41%,
                #111 42%,
                var(--yellow) 50%, var(--yellow) 51%,
                #111 52%,
                #000 70%
            ), 
            radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 1;
        }

        /* De Timer in het midden */
        .timer-label {
            position: relative;
            width: 120px;
            height: 120px;
            background: #111;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 4px solid var(--pink);
        }

        .timer-val { font-size: 3rem; color: var(--pink); line-height: 1; }
        .timer-text { font-size: 0.6rem; color: white; text-transform: uppercase; margin-top: 5px;}

        /* Animatie voor het draaien */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .playing .record {
            animation: spin 3s linear infinite;
        }

        /* Controls */
        .controls { margin-top: 40px; display: flex; gap: 15px; }
        
        button { 
            padding: 15px 30px; 
            font-size: 1rem; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-pause { background: var(--yellow); color: var(--dark); }
        .btn-reveal { background: var(--pink); color: white; }
        .hidden { display: none; }
        
        #answer-text { margin-top: 25px; color: var(--yellow); font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1>PITSTER QUIZ</h1>
    <div class="track-info">TRACK #<span id="track-num">--</span></div>

    <div class="record-container" id="record-player">
        <div class="record"></div>
        <div class="timer-label">
            <div class="timer-val" id="countdown">30</div>
            <div class="timer-text">sec over</div>
        </div>
    </div>

    <div class="controls">
        <button id="pause-btn" class="btn-pause">START</button>
        <button id="reveal-btn" class="btn-reveal hidden">VERDER LUISTEREN</button>
    </div>

    <div id="answer-text" class="hidden"></div>

    <audio id="player"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const trackId = params.get('track');
        const audio = document.getElementById('player');
        const container = document.getElementById('record-player');
        const timerDisplay = document.getElementById('countdown');
        const pauseBtn = document.getElementById('pause-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const answerText = document.getElementById('answer-text');

        let timeLeft = 30;
        let timer = null;
        let isPlaying = false;

        if (trackId) {
            document.getElementById('track-num').innerText = trackId;
            audio.src = `${trackId.padStart(3, '0')}.mp3`;
        }

        function togglePlay() {
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                container.classList.add('playing');
                pauseBtn.innerText = "PAUZE";
                
                // Start of hervat de timer
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timerDisplay.innerText = timeLeft;
                    } else {
                        stopMusic();
                    }
                }, 1000);
            } else {
                // Pauzeer muziek, plaat én timer
                audio.pause();
                isPlaying = false;
                container.classList.remove('playing');
                pauseBtn.innerText = "VERDER";
                clearInterval(timer);
            }
        }

        function stopMusic() {
            audio.pause();
            isPlaying = false;
            container.classList.remove('playing');
            clearInterval(timer);
            pauseBtn.classList.add('hidden');
            revealBtn.classList.remove('hidden');
        }

        // Klikken op de plaat OF de knop start/pauzeert
        container.onclick = togglePlay;
        pauseBtn.onclick = togglePlay;

        revealBtn.onclick = () => {
            answerText.innerText = "NR: " + trackId + " - Check je lijst!";
            answerText.classList.remove('hidden');
            audio.play(); // Speel de rest van het nummer
            container.classList.add('playing');
            revealBtn.innerText = "AAN HET FEESTEN...";
        };
    </script>
</body>
</html>
