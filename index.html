<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitster Quiz - Vinyl Edition</title>
    <style>
        :root {
            --pink: #ff1493;
            --yellow: #ffda00;
            --orange: #ff8c00;
            --dark: #0a122e;
        }

        body { 
            background: var(--dark); 
            color: white; 
            font-family: 'Arial Black', 'Arial Bold', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        h1 { color: var(--pink); margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }
        .track-info { font-size: 1.2rem; margin-bottom: 30px; color: var(--yellow); }

        /* De LP Container */
        .record-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* De Groep die draait (alleen de plaat en ringen) */
        .vinyl-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        /* De zwarte basisplaat */
        .record-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* De gekleurde ringen (precies 270 graden) */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 14px solid transparent;
        }

        .ring-pink {
            width: 270px; height: 270px;
            border-top-color: var(--pink);
            border-right-color: var(--pink);
            border-bottom-color: var(--pink);
            transform: rotate(45deg);
        }

        .ring-orange {
            width: 215px; height: 215px;
            border-top-color: var(--orange);
            border-right-color: var(--orange);
            border-bottom-color: var(--orange);
            transform: rotate(-15deg);
        }

        .ring-yellow {
            width: 160px; height: 160px;
            border-top-color: var(--yellow);
            border-right-color: var(--yellow);
            border-bottom-color: var(--yellow);
            transform: rotate(120deg);
        }

        /* De Timer (staat STIL in het midden) */
        .center-label {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 5px solid white;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .timer-val { 
            font-size: 3rem; 
            color: var(--pink); 
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
        }

        /* Animatie voor het draaien */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .playing .vinyl-wrapper {
            animation: spin 2s linear infinite;
        }

        /* Controls */
        .controls { margin-top: 40px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        
        button { 
            padding: 12px 35px; 
            font-size: 1rem; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-pause { background: var(--yellow); color: var(--dark); }
        .btn-reveal { background: var(--pink); color: white; }
        .hidden { display: none; }
        
        #answer-text { margin-top: 20px; color: var(--yellow); font-size: 1.3rem; text-align: center; }
    </style>
</head>
<body>

    <h1>PITSTER</h1>
    <h3>DE CRISISVRIJE MUZIEKQUIZ</h3>

    <div class="record-container" id="record-player">
        <div class="vinyl-wrapper">
            <div class="record-base"></div>
            <div class="ring ring-pink"></div>
            <div class="ring ring-orange"></div>
            <div class="ring ring-yellow"></div>
        </div>
        
        <div class="center-label">
            <div class="timer-val" id="countdown">30</div>
        </div>
    </div>

    <div class="controls">
        <button id="pause-btn" class="btn-pause">START</button>
        <button id="reveal-btn" class="btn-reveal hidden">VERDER LUISTEREN</button>
        <div id="answer-text" class="hidden"></div>
    </div>

    <audio id="player"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const trackId = params.get('track');
        const audio = document.getElementById('player');
        const container = document.getElementById('record-player');
        const timerDisplay = document.getElementById('countdown');
        const pauseBtn = document.getElementById('pause-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const answerText = document.getElementById('answer-text');

        let timeLeft = 30;
        let timer = null;
        let isPlaying = false;

        if (trackId) {
            document.getElementById('track-num').innerText = trackId;
            audio.src = `${trackId.padStart(3, '0')}.mp3`;
        }

        function togglePlay() {
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                container.classList.add('playing');
                pauseBtn.innerText = "PAUZE";
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timerDisplay.innerText = timeLeft;
                    } else {
                        stopMusic();
                    }
                }, 1000);
            } else {
                audio.pause();
                isPlaying = false;
                container.classList.remove('playing');
                pauseBtn.innerText = "VERDER";
                clearInterval(timer);
            }
        }

        function stopMusic() {
            audio.pause();
            isPlaying = false;
            container.classList.remove('playing');
            clearInterval(timer);
            pauseBtn.classList.add('hidden');
            revealBtn.classList.remove('hidden');
        }

        container.onclick = togglePlay;
        pauseBtn.onclick = togglePlay;

        revealBtn.onclick = () => {
            answerText.innerText = "ANTWOORD: Check lijst nr " + trackId;
            answerText.classList.remove('hidden');
            audio.play();
            container.classList.add('playing');
            revealBtn.innerText = "AAN HET AFSPELEN...";
        };
    </script>
</body>
</html>
